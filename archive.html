<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Все публикации — Шабаш Валькирии</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: #0a0a0a;
      background-image: radial-gradient(circle at 10% 20%, #2a0a0a 1px, transparent 1px);
      background-size: 25px 25px;
      color: #e6e6e6;
      line-height: 1.5;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #1a1a1a;
      border-radius: 24px;
      padding: 30px 40px 50px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 0 1px #2e2e2e inset;
    }
    .top-nav {
      text-align: right;
      margin-bottom: 30px;
    }
    .top-nav a {
      color: #c9a87b;
      text-decoration: none;
      background: #2a1e12;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.9rem;
      margin-left: 10px;
      transition: 0.2s;
      display: inline-block;
    }
    .top-nav a:hover {
      background: #8b0000;
      color: white;
    }
    /* Активная ссылка (Главная) — красная */
    .top-nav a.active {
      background: #8b0000;
      color: white;
    }
    /* Telegram всегда синий */
    .top-nav a.telegram {
      background: #0088cc;
      color: white;
    }
    .top-nav a.telegram:hover {
      background: #006699;
    }
    h1 {
      font-size: 2.4rem;
      color: #c9a87b;
      border-left: 5px solid #8b0000;
      padding-left: 20px;
      margin-bottom: 30px;
    }
    .archive-year {
      margin-top: 30px;
    }
    .archive-year h2 {
      color: #d4b48c;
      border-bottom: 1px dashed #5a3e2e;
      padding-bottom: 5px;
      margin-bottom: 15px;
    }
    .archive-month {
      margin-left: 20px;
      margin-bottom: 20px;
    }
    .archive-month h3 {
      color: #c9a87b;
      margin: 10px 0;
      font-weight: normal;
      font-size: 1.3rem;
    }
    .archive-list {
      list-style: none;
    }
    .archive-list li {
      margin: 8px 0;
      padding: 8px 12px;
      background: #222;
      border-left: 3px solid #8b0000;
    }
    .archive-list a {
      color: #e6d5b3;
      text-decoration: none;
      font-weight: bold;
    }
    .archive-list a:hover {
      color: #ffb347;
      text-decoration: underline;
    }
    .archive-date {
      color: #8b6b4d;
      font-size: 0.8rem;
      margin-left: 10px;
    }
    .back-link {
      display: inline-block;
      margin-top: 30px;
      background: #2a1e12;
      padding: 6px 14px;
      border-radius: 30px;
      color: #c9a87b;
      text-decoration: none;
    }
    @media (max-width: 768px) {
      .container { padding: 20px; }
      h1 { font-size: 1.8rem; }
      .top-nav { text-align: center; margin-bottom: 20px; }
      .top-nav a { margin: 5px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="top-nav">
    <a href="index.html" class="active">Главная</a>
    <a href="https://t.me/valshabash" target="_blank" class="telegram">📱 Telegram</a>
  </div>
  <h1>Все публикации</h1>
  <div id="archive-content"></div>
  <a href="index.html" class="back-link">← На главную</a>
</div>

<script>
  fetch('posts.json')
    .then(r => r.json())
    .then(posts => {
      // Сортировка от новых к старым
      posts.sort((a,b) => new Date(b.date.split('.').reverse().join('-')) - new Date(a.date.split('.').reverse().join('-')));
      
      // Группировка по году и месяцу
      const grouped = {};
      posts.forEach(post => {
        const [day, month, year] = post.date.split('.');
        const key = `${year}-${month}`;
        if (!grouped[key]) grouped[key] = { year, month, posts: [] };
        grouped[key].posts.push(post);
      });
      
      // Формирование HTML
      let html = '';
      for (let key in grouped) {
        const { year, month, posts } = grouped[key];
        // Название месяца без года
        const monthName = new Date(year, month-1, 1).toLocaleString('ru', { month: 'long' });
        html += `<div class="archive-year"><h2>${year}</h2><div class="archive-month"><h3>${monthName}</h3><ul class="archive-list">`;
        posts.forEach(post => {
          html += `<li><a href="${post.url}">${post.title}</a><span class="archive-date">(${post.date})</span></li>`;
        });
        html += `</ul></div></div>`;
      }
      document.getElementById('archive-content').innerHTML = html;
    })
    .catch(e => {
      document.getElementById('archive-content').innerHTML = '<p style="color:red;">Ошибка загрузки архива.</p>';
      console.error(e);
    });
</script>
</body>
</html>
